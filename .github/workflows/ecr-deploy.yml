name: CI/CD to AWS ECR

on:
  push:
    branches: [feature/ecr-dockerhub]

env:
  VAULT_ADDR: http://192.168.0.116:8200
  VAULT_PATH: secret/Dev-secret/authentik
  AWS_REGION: us-east-1

jobs:
  build-and-push:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate with Vault and export secrets
        id: vault
        env:
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
        run: |
          export VAULT_TOKEN=$VAULT_TOKEN
          vault token lookup || exit 1

          # Export Vault secrets to GITHUB_ENV
          for row in $(vault kv get -format=json $VAULT_PATH | jq -r '.data.data | to_entries[] | @base64'); do
            _jq() {
              echo "${row}" | base64 --decode | jq -r ${1}
            }
            key=$(_jq '.key')
            val=$(_jq '.value')
            echo "$key=$val" >> $GITHUB_ENV
          done

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY

      - name: Build and Push Images to ECR
        run: |
          for svc in postgres redis server worker; do
            docker build -t $ECR_REGISTRY/authentik-${svc}:${AUTHENTIK_TAG} -f Dockerfile.${svc} .
            docker push $ECR_REGISTRY/authentik-${svc}:${AUTHENTIK_TAG}
          done

      - name: Deploy using Docker Compose
        run: |
          docker compose up -d

